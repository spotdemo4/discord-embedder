name: 'init'
description: 'initialize nix'
runs:
  using: 'composite'
  steps:
    - name: Harden the runner
      uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
      with:
        egress-policy: audit

    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea # v19
      with:
        extra-conf: |
          extra-substituters = https://trevnur.cachix.org
          extra-trusted-public-keys = trevnur.cachix.org-1:hBd15IdszwT52aOxdKs5vNTbq36emvEeGqpb25Bkq6o=

    - uses: spotdemo4/nix-simple-cache-action@6ac0dd1b576ce784ff8ee87c83a2b08006372601 # v1.4.6

    - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
