name: flake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: spotdemo4/discord-embedder/.github/actions/init@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: flake-checker -f
