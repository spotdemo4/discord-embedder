name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: spotdemo4/discord-embedder/.github/actions/init@main

      - run: nix flake check -L

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: spotdemo4/discord-embedder/.github/actions/init@main

      - run: |
          mkdir binaries

          nix build .#linux-amd64
          tar czf discord-embedder-linux-amd64.tar.gz -C result/bin discord-embedder
          mv discord-embedder-linux-amd64.tar.gz binaries

          nix build .#linux-arm64
          tar czf discord-embedder-linux-arm64.tar.gz -C result/bin discord-embedder
          mv discord-embedder-linux-arm64.tar.gz binaries

          nix build .#linux-arm
          tar czf discord-embedder-linux-arm.tar.gz -C result/bin discord-embedder
          mv discord-embedder-linux-arm.tar.gz binaries

          nix build .#darwin-arm64
          tar czf discord-embedder-darwin-arm64.tar.gz -C result/bin discord-embedder
          mv discord-embedder-darwin-arm64.tar.gz binaries

          nix build .#windows-amd64
          zip -j discord-embedder-windows-amd64.zip result/bin/discord-embedder.exe
          mv discord-embedder-windows-amd64.zip binaries

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true
          files: |-
            binaries/*

  package:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: spotdemo4/discord-embedder/.github/actions/init@main

      - name: Build & push images
        run: |
          nix build .#image

          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}

          ./result | gzip --fast | skopeo copy \
            --dest-creds=${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} \
            docker-archive:/dev/stdin \
            docker://ghcr.io/spotdemo4/discord-embedder:$VERSION

  tag:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - run: git push origin "${{ github.ref_name }}:latest" --force
