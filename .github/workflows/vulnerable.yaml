name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@58f36ed28ae402a42f3c900df4570a273550d953 # v1.21.0
        with:
          shell: vulnerable

      - name: Run govulncheck
        run: govulncheck ./...

  nix:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@58f36ed28ae402a42f3c900df4570a273550d953 # v1.21.0
        with:
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  actions:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@58f36ed28ae402a42f3c900df4570a273550d953 # v1.21.0
        with:
          shell: vulnerable

      - name: Run octoscan
        run: octoscan scan .github
