name: bump

on:
  schedule:
    - cron: "0 22 * * 1-5" # every weekday at 22:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "force"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

concurrency:
  group: release
  cancel-in-progress: false

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  bump:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@65167e71611029bf1f64e4dd6492de35ab553ae2 # v1.66.2
        with:
          token: ${{ secrets.DOCTOR_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          fetch_depth: 0
          shell: bump

      - name: Bump
        run: |
          set -euo pipefail

          force="${MANUAL_FORCE:-false}"
          force_bump_type=patch
          impact="$(scripts/runtime-dependency-impact.sh)"

          case "$impact" in
            minor)
              force=true
              force_bump_type=minor
              ;;
            none) ;;
            *)
              printf 'invalid runtime dependency impact: %q\n' "$impact" >&2
              exit 1
              ;;
          esac

          FORCE="$force" FORCE_BUMP_TYPE="$force_bump_type" bumper
        env:
          GITHUB_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          MANUAL_FORCE: ${{ inputs.force }}
